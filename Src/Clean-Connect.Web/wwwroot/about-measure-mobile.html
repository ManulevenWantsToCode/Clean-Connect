<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        body { margin: 0; font: 15px/1.5 Consolas, monospace; color: #111; background: #fff; }
        iframe { display: block; width: 500px; height: 900px; border: 0; }
        #out { position: fixed; top: 0; left: 0; z-index: 9; max-width: 900px; padding: 24px; background: #fff; border: 2px solid #111; white-space: pre-wrap; }
    </style>
</head>
<body>
    <pre id="out">loading</pre>
    <iframe id="frame" src="/Home/About"></iframe>
    <script>
        frame.addEventListener("load", function () {
            var d = frame.contentDocument;
            var names = [".cc-about-hero", ".cc-metrics-strip", ".cc-about-story", ".cc-about-values", ".cc-about-how", ".cc-about-cta", ".cc-site-footer"];
            var out = names.map(function (sel) {
                var el = d.querySelector(sel);
                var r = el.getBoundingClientRect();
                return sel + ": top=" + r.top.toFixed(0) + " height=" + r.height.toFixed(0) + " bottom=" + r.bottom.toFixed(0);
            });
            out.push("scrollHeight=" + d.documentElement.scrollHeight);
            document.getElementById("out").textContent = out.join("\n");
            document.getElementById("frame").style.display = "none";
        });
    </script>
</body>
</html>
